<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Admin{% endblock %} · Job Scalper</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #f6f7f9; }
    header { background: #111827; color: #fff; padding: 0 20px; display: flex; align-items: center; gap: 18px; }
    header a { color: #cbd5e1; text-decoration: none; padding: 14px 4px; display: inline-block; }
    header a:hover, header a.active { color: #fff; border-bottom: 2px solid #60a5fa; }
    header .spacer { margin-left: auto; }
    header .who { color: #94a3b8; font-size: 13px; }
    main { max-width: 1080px; margin: 24px auto; padding: 0 20px; }
    h1 { font-size: 22px; margin: 0 0 18px; }
    h2 { font-size: 16px; margin: 26px 0 10px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid #eef0f3; font-size: 14px; vertical-align: top; }
    th { background: #fafbfc; font-weight: 600; color: #4b5563; }
    tr:last-child td { border-bottom: 0; }
    .cards { display: flex; flex-wrap: wrap; gap: 14px; }
    .card { background: #fff; border-radius: 8px; padding: 16px 18px; box-shadow: 0 1px 2px rgba(0,0,0,.06); min-width: 150px; }
    .card .n { font-size: 26px; font-weight: 700; }
    .card .l { color: #6b7280; font-size: 13px; }
    form.inline { display: inline; }
    button, .btn { font: inherit; padding: 6px 12px; border: 1px solid #d1d5db; background: #fff; border-radius: 6px; cursor: pointer; }
    button:hover { background: #f3f4f6; }
    button.danger { color: #b91c1c; border-color: #fca5a5; }
    button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
    input, select, textarea { font: inherit; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; }
    textarea { width: 100%; font-family: ui-monospace, monospace; font-size: 13px; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; color: #4b5563; font-weight: 600; }
    .flash { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; }
    .muted { color: #6b7280; }
    .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #e5e7eb; }
    .pill.suspended { background: #fee2e2; color: #991b1b; }
    .pill.admin { background: #dbeafe; color: #1e40af; }
    .pill.failed { background: #fee2e2; color: #991b1b; }
    .pill.succeeded { background: #dcfce7; color: #166534; }
    code { background: #f3f4f6; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
    .login { max-width: 380px; margin: 12vh auto; background: #fff; padding: 34px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.08); text-align: center; }
  </style>
</head>
<body>
{% if admin %}
<header>
  <strong>Job Scalper</strong>
  <a href="/" class="{{ 'active' if active=='dashboard' }}">Dashboard</a>
  <a href="/users" class="{{ 'active' if active=='users' }}">Users</a>
  <a href="/settings" class="{{ 'active' if active=='settings' }}">Settings</a>
  <a href="/jobs" class="{{ 'active' if active=='jobs' }}">Jobs &amp; Pool</a>
  <a href="/sources" class="{{ 'active' if active=='sources' }}">Sources</a>
  <a href="/audit" class="{{ 'active' if active=='audit' }}">Audit</a>
  <span class="spacer"></span>
  <span class="who">{{ admin.email }}</span>
  <form class="inline" method="post" action="/logout"><button>Sign out</button></form>
</header>
{% endif %}
<main>
  {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
