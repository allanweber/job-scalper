[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-scalper"
version = "0.1.0"
description = "Personal job scalper: collect remote tech jobs from many sources, score against your criteria, report as HTML."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pypdf>=4.0",
]

[project.optional-dependencies]
# Layered on later: semantic similarity (Stage 1) and LLM enrichment (Stage 2).
semantic = ["sentence-transformers>=2.7"]
llm = ["anthropic>=0.39"]
scrape = ["playwright>=1.44"]
# PDF renditions of drafted resumes/cover letters: HTML->PDF via headless Chromium
# (reusing Playwright) plus a markdown renderer. See ADR 0007.
pdf = ["playwright>=1.44", "markdown>=3.5"]
# Multi-tenant service (FastAPI API + RQ worker + admin web app). See docs/DESIGN.md.
# Note: the libsql client is published as `libsql` (newer) or `libsql-experimental`;
# scalper.db.connection imports whichever is present.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "libsql>=0.1",
    "redis>=5.0",
    "rq>=1.16",
    "cryptography>=42.0",
    "pyjwt>=2.8",
    "google-auth>=2.29",
    "authlib>=1.3",
    "python-multipart>=0.0.9",
    "weasyprint>=61.0",
    "openai>=1.30",
]
dev = ["pytest>=8.0"]
# Everything CI needs to run the full test suite green. Base deps come with the
# package; semantic/pdf/scrape-only tests importorskip when their extras are absent.
test = [
    "pytest>=8.0",
    "cryptography>=42.0",
    "pyjwt>=2.8",
    "anthropic>=0.39",
]

[project.scripts]
scalper = "scalper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scalper = ["templates/*.html", "db/migrations/*.sql"]
