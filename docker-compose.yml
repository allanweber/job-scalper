# Job Scalper — single-stack deploy (Dokploy "Compose" service).
#
# The database is a SEPARATE managed Dokploy PostgreSQL service (automatic
# backups, no self-managed volume). This stack runs one image as four Python
# processes (api, admin, worker, scheduler) plus Redis, fronted by a Cloudflare
# Tunnel (cloudflared) — the only ingress. Nothing publishes a host port.
#
# Networking:
#   * `internal`      — private to this stack (cloudflared ⇄ api/admin, ⇄ redis).
#   * `dokploy-network` — Dokploy's shared network, so api/worker/scheduler can
#     reach the managed Postgres service by its hostname. Set that hostname in
#     SCALPER_DATABASE_URL (see .env.example).
#
# See docs/deployment/dokploy-cloudflare.md and postgres-dokploy.md.

x-app: &app
  build:
    context: .
  image: job-scalper:latest
  env_file: .env
  restart: unless-stopped
  depends_on:
    - redis
  networks:
    - internal
    - dokploy-network

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - internal

  api:
    <<: *app
    command: >
      uvicorn --factory scalper.service.app:create_app
      --host 0.0.0.0 --port 8080 --proxy-headers --forwarded-allow-ips=*
    expose:
      - "8080"

  admin:
    <<: *app
    command: >
      uvicorn --factory scalper.admin.app:create_admin_app
      --host 0.0.0.0 --port 8081 --proxy-headers --forwarded-allow-ips=*
    expose:
      - "8081"

  worker:
    <<: *app
    command: ["scalper-worker"]

  scheduler:
    <<: *app
    command: ["scalper-scheduler"]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN}"]
    depends_on:
      - api
      - admin
    networks:
      - internal

networks:
  internal:
    driver: bridge
  # Dokploy's shared network; must already exist (created by Dokploy). Lets this
  # stack reach the managed Postgres service by hostname.
  dokploy-network:
    external: true

volumes:
  redis-data:
