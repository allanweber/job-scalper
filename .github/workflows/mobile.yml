name: Mobile

# Builds the Android app and publishes it to a GitHub Release so it can be
# installed directly (no artifact-zip to extract). Two outputs: an APK for
# direct/tap-to-install sideloading (attached to the Release) and an AAB (App
# Bundle) for Play — the only format Play accepts for new apps. The AAB isn't
# directly installable, so it's kept as a build artifact rather than put on the
# public Release, where a non-installable download would confuse. A `mobile-v*`
# tag cuts a normal release named from the tag; a manual run (workflow_dispatch)
# cuts a prerelease tagged `mobile-v<version>-build.<run>` from the current
# branch, so you always have a tap-to-install APK. App CI (checks + build, no
# release) runs on every app-touching PR and every app-touching merge to main;
# a merge that doesn't touch the app skips the build. Release signing uses an
# upload keystore
# when the corresponding repository secrets are set; the same config signs both
# the APK and the AAB. Otherwise the build falls back to debug signing
# (installable, but not Play-Store publishable).
on:
  # PRs are path-filtered natively, so a PR only spins this up when it touches
  # the app. Pushes can't be path-filtered here without breaking releases: a
  # `mobile-v*` tag is pushed onto an existing commit (zero new commits), so a
  # `paths` filter would match nothing and silently skip the release build.
  # Instead the push fires on every main commit and every release tag, and the
  # `changes` job below decides whether the heavy build is actually warranted.
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  push:
    branches:
      - main
    tags:
      - 'mobile-v*'
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # create the release + upload the APK asset

jobs:
  # Cheap gate (~seconds) so a main push that doesn't touch the app doesn't cost
  # a full Flutter build. It only guards the main-branch case; PRs are already
  # path-filtered, and releases bypass it (see the build job's `if`).
  changes:
    name: detect app changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'mobile/**'
              - '.github/workflows/mobile.yml'

  build:
    name: build
    needs: changes
    # Build when the app actually changed, or on any release path (a mobile-v*
    # tag or a manual run) regardless of the diff. On a PR the trigger is
    # already app-scoped, so `changes` reports true there too. The net effect:
    # app CI runs on every app-touching PR and main merge, and every release,
    # but a backend-only merge to main skips the ~8-minute build.
    # `always()` guards the release path: without it, a hiccup in the `changes`
    # job would leave `needs` unsatisfied and silently skip a tagged release.
    if: >-
      ${{ always() && (
        needs.changes.outputs.app == 'true'
        || startsWith(github.ref, 'refs/tags/mobile-v')
        || github.event_name == 'workflow_dispatch'
      ) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Configure release signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Derive version
        id: ver
        # Every build gets a monotonic versionCode (the run number) so successive
        # installs register as real updates instead of "version 1 over version 1".
        # Tag builds take the versionName from the tag (mobile-v1.2.3) and cut a
        # normal release; manual builds take it from pubspec, uniquify the tag
        # with the run number, and cut a prerelease.
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == mobile-v* ]]; then
            name="${GITHUB_REF_NAME#mobile-v}"
            echo "args=--build-name=${name} --build-number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release_name=${name}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            base="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//')"
            echo "args=--build-name=${base} --build-number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "tag=mobile-v${base}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "release_name=${base} (build ${GITHUB_RUN_NUMBER})" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        # GOOGLE_SERVER_CLIENT_ID is the Google *Web* OAuth client id; it makes
        # the returned ID token's audience match the backend's
        # SCALPER_GOOGLE_AUDIENCES. Empty when the secret is unset (build still
        # succeeds; native sign-in just won't return a token until it's set).
        run: >-
          flutter build apk --release ${{ steps.ver.outputs.args }}
          --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-scalper-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Build release App Bundle
        # The .aab is what Play accepts for new apps. Same version args and
        # signing config as the APK above (the gradle `release` signingConfig
        # covers both build outputs), so this produces a signed, upload-ready
        # bundle whenever the keystore secrets are set.
        run: >-
          flutter build appbundle --release ${{ steps.ver.outputs.args }}
          --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }}

      - name: Verify App Bundle with bundletool
        # Acceptance gate for PLAY-1: prove the .aab is structurally sound and
        # readable before we'd ever hand it to Play. `validate` is the right
        # depth here — it catches a corrupt/malformed bundle without re-deriving
        # APKs (which `flutter build appbundle` already did) or pulling the
        # signing key into a verification step.
        env:
          BUNDLETOOL_VERSION: '1.17.2'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate \
            --bundle build/app/outputs/bundle/release/app-release.aab

      - name: Upload AAB artifact
        # Artifact only — an .aab isn't tap-to-install, so it stays off the
        # public Release (below) and is retained here for Play upload.
        uses: actions/upload-artifact@v4
        with:
          name: job-scalper-release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish GitHub Release
        # Tag pushes and manual runs both publish; PR builds only check + build.
        # On a manual run this creates the tag (steps.ver.outputs.tag) at the
        # current commit, so the APK is a direct, tap-to-install download.
        if: ${{ startsWith(github.ref, 'refs/tags/mobile-v') || github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.release_name }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
