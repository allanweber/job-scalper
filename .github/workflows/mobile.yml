name: Mobile

# Builds the Android APK and publishes it to a GitHub Release so it can be
# installed directly (no artifact-zip to extract). A `mobile-v*` tag cuts a
# normal release named from the tag; a manual run (workflow_dispatch) cuts a
# prerelease tagged `mobile-v<version>-build.<run>` from the current branch, so
# you always have a tap-to-install APK. PRs that touch the app only run the
# checks + build (no release). Release signing uses an upload keystore when the
# corresponding repository secrets are set; otherwise the build falls back to
# debug signing (installable, but not Play-Store publishable).
on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # create the release + upload the APK asset

jobs:
  build:
    name: build apk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Configure release signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Derive version
        id: ver
        # Every build gets a monotonic versionCode (the run number) so successive
        # installs register as real updates instead of "version 1 over version 1".
        # Tag builds take the versionName from the tag (mobile-v1.2.3) and cut a
        # normal release; manual builds take it from pubspec, uniquify the tag
        # with the run number, and cut a prerelease.
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == mobile-v* ]]; then
            name="${GITHUB_REF_NAME#mobile-v}"
            echo "args=--build-name=${name} --build-number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release_name=${name}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            base="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//')"
            echo "args=--build-name=${base} --build-number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "tag=mobile-v${base}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "release_name=${base} (build ${GITHUB_RUN_NUMBER})" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        # GOOGLE_SERVER_CLIENT_ID is the Google *Web* OAuth client id; it makes
        # the returned ID token's audience match the backend's
        # SCALPER_GOOGLE_AUDIENCES. Empty when the secret is unset (build still
        # succeeds; native sign-in just won't return a token until it's set).
        run: >-
          flutter build apk --release ${{ steps.ver.outputs.args }}
          --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-scalper-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        # Tag pushes and manual runs both publish; PR builds only check + build.
        # On a manual run this creates the tag (steps.ver.outputs.tag) at the
        # current commit, so the APK is a direct, tap-to-install download.
        if: ${{ startsWith(github.ref, 'refs/tags/mobile-v') || github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.release_name }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
